<!doctype html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Time Tracker - Caroda / AYM / Testy</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-orb bg-orb-a" aria-hidden="true"></div>
  <div class="bg-orb bg-orb-b" aria-hidden="true"></div>
  <main class="app">
    <header class="app-header">
      <div class="header-top">
        <h1>Time Tracker</h1>
        <label class="theme-switch" for="themeSelect">
          Vzhled
          <select id="themeSelect" aria-label="Vyber vzhled aplikace">
            <option value="sunrise">Sunrise Glass</option>
            <option value="slate">Slate Focus</option>
            <option value="citrus">Citrus Pop</option>
            <option value="r2b2-caroda">R2B2/Caroda</option>
          </select>
        </label>
      </div>
      <p id="todayLabel" class="today-label"></p>
      <p class="theme-note">Zkus přepnout variantu UI a vyber si, která ti sedí nejvíc.</p>
    </header>

    <section class="panel">
      <h2>Aktivita</h2>
      <div class="buttons">
        <button class="activity-btn" data-activity="Caroda">Caroda</button>
        <button class="activity-btn" data-activity="AYM">AYM</button>
        <button class="activity-btn" data-activity="Automatizované testy">Automatizované testy</button>
      </div>
      <button id="stopBtn" class="stop-btn">Zastavit</button>
      <p id="activeStatus" class="active-status">Aktualne: nic nebezi</p>
      <p id="sessionTimer" class="session-timer">00:00:00</p>
    </section>

    <section class="panel">
      <h2>Dnešní souhrn</h2>
      <div class="summary-grid">
        <div class="card">
          <p>Caroda</p>
          <strong id="totalCaroda">00:00:00</strong>
        </div>
        <div class="card">
          <p>AYM</p>
          <strong id="totalAYM">00:00:00</strong>
        </div>
        <div class="card">
          <p>Automatizované testy</p>
          <strong id="totalTests">00:00:00</strong>
        </div>
      </div>
      <p class="overall">Celkově dnes: <strong id="totalAll">00:00:00</strong></p>
      <button id="exportWeeklyBtn" class="export-btn">Otevřít týdenní report</button>
    </section>

    <section class="panel">
      <h2>Poslední záznamy</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Aktivita</th>
              <th>Od</th>
              <th>Do</th>
              <th>Trvání</th>
            </tr>
          </thead>
          <tbody id="entriesBody"></tbody>
        </table>
      </div>
      <button id="entriesToggleBtn" class="entries-toggle-btn" style="display:none"></button>
    </section>

  </main>

  <script src="app.js"></script>
</body>
</html>
